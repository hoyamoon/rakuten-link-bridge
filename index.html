<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#333}
.container{text-align:center;padding:40px 24px;max-width:360px}
.spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#bf0000;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:14px;color:#666;line-height:1.6}
.fallback-btn{display:none;margin-top:24px;padding:14px 32px;background:#bf0000;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.fallback-btn:active{background:#990000}
.debug{display:none;margin-top:20px;text-align:left;font-size:11px;color:#999;background:#fff;border:1px solid #eee;border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;word-break:break-all;line-height:1.5}
.debug .ok{color:#2a7}
.debug .err{color:#c44}
.debug .info{color:#58c}
</style>
</head>
<body>
<div class="container">
  <div class="spinner" id="spinner"></div>
  <p class="msg" id="msg">楽天市場アプリで開いています...</p>
  <a class="fallback-btn" id="fallbackBtn">ブラウザで開く</a>
  <div class="debug" id="debug"></div>
</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // Link Bridge v2.2  —  2026.08.18
  //
  // v2.1 → v2.2 변경사항:
  //
  // [FIX-#4] intent:// 미지원 브라우저 데드엔드(에러 페이지) 차단
  //   → 증상: 안드로이드 인앱 웹뷰/일부 서드파티 브라우저에서 광고
  //     링크 클릭 시 net::ERR_UNKNOWN_URL_SCHEME 에러 페이지가 뜨고
  //     앱도 안 열림. 원인은 fireIntent()가 top-frame을 raw intent://로
  //     이동시키는데, 해당 브라우저가 intent:// 스킴을 처리하지 못해서.
  //   → 해결: UA로 intent:// 처리 가능 브라우저(canIntent, Chromium
  //     계열 & 인앱 웹뷰 아님)를 판별. 미지원 환경에서는 top-frame을
  //     intent://로 옮기지 않고 웹 fallback URL(https)로 직접 이동해
  //     데드엔드를 없애고 최소한 상품 페이지 + 클릭 적립은 보장.
  //   → openInBrowser()의 Chrome/Samsung 이스케이프(intent://)도 동일
  //     이유로 미지원 환경에서는 웹 URL 직접 이동으로 대체.
  //
  // v2.0 → v2.1 변경사항:
  //
  // [FIX-#1] blur 오탐 데드엔드 방지
  //   → appLaunched 값과 무관하게, 4초 뒤에도 페이지가 화면에 떠
  //     있으면(document.hidden=false → 실제로는 앱 미실행) 수동
  //     fallback 버튼을 강제 노출하는 안전망 추가.
  //
  // [FIX-#3] Chrome/Samsung Intent의 S.browser_fallback_url 제거
  //   → 브라우저 미설치 시 WebView가 hb.afl로 조기 이동해
  //     autoVerify에 가로채이던 문제 차단. 이탈 여부를
  //     document.hidden으로 판정하고 타이머 체인
  //     (Chrome→Samsung→직접이동)으로 단계적 escalation.
  //
  // [FIX-#2] 클릭 등록 safety timeout 3000ms → 800ms 단축
  //   → 관련 주석을 실제 값과 일치시킴. 요청은 발사 즉시 서버에
  //     도달하므로 응답 완료까지 길게 대기할 필요 없음.
  //
  // v1.0 → v2.0 변경사항:
  //
  // [BUG-FIX] decodeURIComponent() 이중 디코딩 제거
  //   → v1.0에서 Intent URL의 S.browser_fallback_url 인코딩이
  //     깨지는 버그 수정. params.get()이 이미 1회 디코딩하므로
  //     추가 디코딩 불필요.
  //
  // [FIX-1] 클릭 등록 완료 후 Intent 실행 (레이스 컨디션 해소)
  //   → fetch + Image 듀얼 트래킹, 완료 대기 후 Intent 발사
  //   → 최대 800ms 대기 (타임아웃)
  //
  // [FIX-2] Visibility API로 앱 실행 감지
  //   → document.hidden / blur / pagehide 이벤트 모니터링
  //   → 앱이 열리면 fallback 취소
  //
  // [FIX-3] Fallback: Chrome Intent로 외부 브라우저 유도
  //   → WebView 내 autoVerify 완전 우회
  //   → Chrome → Samsung Browser → 직접이동 순서
  //   → 외부 브라우저에서 hb.afl 리다이렉트 체인 정상 완료
  //   → 쿠키 세팅 + 매출 귀속 정상화
  //
  // [NEW] 디버그 모드 (?debug=1 추가 시 활성화)
  //
  // URL 파라미터:
  //   ?intent={encodeURIComponent(Intent URL)}
  //   &fallback={encodeURIComponent(Fallback URL)}
  //   &aff={encodeURIComponent(Affiliate URL)}  [선택]
  //   &debug=1  [선택, 디버그 로그 표시]
  // ============================================================

  var params  = new URLSearchParams(window.location.search);
  var isDebug = params.get('debug') === '1';

  // ---- params.get()은 이미 1회 URL 디코딩을 수행함 ----
  // ---- 추가 decodeURIComponent() 호출하지 않음 (v1.0 버그 수정) ----
  var intentUrl  = params.get('intent');
  var fallbackUrl = params.get('fallback');
  var affUrl     = params.get('aff');

  // 디버그 로거
  var debugEl = document.getElementById('debug');
  if (isDebug) debugEl.style.display = 'block';

  function log(msg, type) {
    if (!isDebug) return;
    var cls = type || 'info';
    var t = new Date();
    var ts = t.getMinutes() + ':' + t.getSeconds() + '.' +
             String(t.getMilliseconds()).padStart(3, '0');
    debugEl.innerHTML += '<div class="' + cls + '">[' + ts + '] ' + msg + '</div>';
    debugEl.scrollTop = debugEl.scrollHeight;
  }

  // ---- 필수 파라미터 확인 ----
  if (!intentUrl || !fallbackUrl) {
    document.getElementById('msg').textContent = 'リンクエラーが発生しました。';
    document.getElementById('spinner').style.display = 'none';
    log('ERROR: intent 또는 fallback 파라미터 없음', 'err');
    return;
  }

  log('Intent URL: ' + intentUrl.substring(0, 80) + '...', 'info');
  log('Fallback URL: ' + fallbackUrl.substring(0, 80) + '...', 'info');
  log('Aff URL: ' + (affUrl ? affUrl.substring(0, 80) + '...' : '없음'), 'info');

  var fallbackBtn = document.getElementById('fallbackBtn');
  var ua          = navigator.userAgent;
  var isAndroid   = /Android/i.test(ua);
  var appLaunched = false;

  // ============================================================
  // intent:// 스킴 처리 가능 여부 판별  (v2.2 [FIX-#4])
  //
  //  - Chromium 계열(Chrome / 삼성인터넷)만 intent://를 앱 실행 또는
  //    S.browser_fallback_url 자동 폴백으로 해석한다.
  //  - 인앱 웹뷰(카톡·인스타·페북·라인·네이버 등)와 일부 서드파티
  //    브라우저는 intent://를 알 수 없는 스킴으로 보고
  //    net::ERR_UNKNOWN_URL_SCHEME 에러 페이지(데드엔드)를 띄운다.
  //  - 이런 환경에서는 top-frame을 intent://로 이동시키면 안 되고,
  //    웹 fallback URL(https)로 직접 이동시켜야 데드엔드가 없다.
  // ============================================================
  var isInAppWebview = /; wv\)|KAKAOTALK|KAKAOSTORY|FB_IAB|FBAN|FBAV|FBIOS|Instagram|Line\/|NAVER|DaumApps|Band\/|Snapchat|TikTok|musical_ly|Twitter|Pinterest|everytimeApp/i.test(ua);
  var isChromium     = /Chrome\/|CriOS|SamsungBrowser\//i.test(ua);
  var canIntent      = isAndroid && isChromium && !isInAppWebview;

  log('Platform: ' + (isAndroid ? 'Android' : 'Other') + ' / canIntent=' + canIntent + ' / UA: ' + ua.substring(0, 60), 'info');

  // ============================================================
  // 앱 실행 감지 (Visibility API + blur + pagehide)
  // ============================================================
  function markLaunched(source) {
    if (!appLaunched) {
      appLaunched = true;
      log('앱 실행 감지! (via ' + source + ')', 'ok');
    }
  }
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) markLaunched('visibilitychange');
  });
  window.addEventListener('blur', function() { markLaunched('blur'); });
  window.addEventListener('pagehide', function() { markLaunched('pagehide'); });

  // ============================================================
  // Step 1: 어필리에이트 클릭 등록 (듀얼 방식)
  //
  // - fetch(): no-cors 모드로 서버에 GET 요청 전송
  //   → 서버 측 클릭 카운트 등록
  //   → credentials:'omit' (쿠키 불필요 — 앱 경유 시 앱이 처리)
  //
  // - Image beacon: 동일 URL로 Image 요청 전송 (중복 보험)
  //   → sub-resource 요청이므로 autoVerify에 가로채이지 않음
  //
  // - 둘 중 하나가 완료되면 callback 실행 (최대 800ms 대기)
  // ============================================================
  function registerClick(callback) {
    if (!affUrl) {
      log('aff URL 없음 → 클릭 등록 스킵', 'info');
      callback();
      return;
    }

    var settled = false;
    function done(source) {
      if (settled) return;
      settled = true;
      log('클릭 등록 완료 (via ' + source + ')', 'ok');
      callback();
    }

    // Method A: fetch
    log('fetch 클릭 등록 시작...', 'info');
    try {
      fetch(affUrl, {
        method: 'GET',
        mode: 'no-cors',
        credentials: 'omit'
      }).then(function() {
        done('fetch');
      }).catch(function(e) {
        log('fetch 실패: ' + e.message, 'err');
        done('fetch-error');
      });
    } catch(e) {
      log('fetch 미지원: ' + e.message, 'err');
    }

    // Method B: Image beacon
    log('Image beacon 클릭 등록 시작...', 'info');
    try {
      var img = new Image();
      img.onload = function() { done('img-load'); };
      img.onerror = function() { done('img-error'); };
      img.src = affUrl;
    } catch(e) {
      log('Image beacon 실패: ' + e.message, 'err');
    }

    // Safety timeout: 800ms 후 무조건 진행
    setTimeout(function() { done('timeout-800ms'); }, 800);
  }

  // ============================================================
  // Step 2: Intent URL 실행 (앱 실행)
  //
  // 방법 1: 숨겨진 iframe (WebView 호환성 높음)
  // 방법 2: 150ms 후 window.location (iframe 실패 보완)
  // ============================================================
  function fireIntent() {
    log('Intent 실행 시작...', 'info');

    // 2a: Hidden iframe
    try {
      var f = document.createElement('iframe');
      f.style.cssText = 'display:none;width:0;height:0;border:0';
      f.src = intentUrl;
      document.body.appendChild(f);
      log('iframe.src = intent URL ✓', 'ok');
    } catch(e) {
      log('iframe 방식 실패: ' + e.message, 'err');
    }

    // 2b: 150ms 후 백업 이동
    setTimeout(function() {
      if (appLaunched) return;

      if (canIntent) {
        // Chrome / 삼성인터넷: top-frame을 intent://로 이동.
        // 앱 설치 시 앱 실행, 미설치 시 S.browser_fallback_url(웹)로 자동 폴백.
        log('window.location = intent URL (backup)', 'info');
        try {
          window.location.href = intentUrl;
        } catch(e) {
          log('location 방식 실패: ' + e.message, 'err');
        }
      } else {
        // intent:// 미지원 브라우저/인앱 웹뷰: top-frame을 intent://로 옮기면
        // net::ERR_UNKNOWN_URL_SCHEME 데드엔드 → 웹 fallback URL(https)로 직접 이동.
        log('intent:// 미지원 환경 → 웹 fallback URL로 직접 이동 (데드엔드 방지)', 'err');
        try {
          window.location.href = fallbackUrl;
        } catch(e) {
          log('fallback 이동 실패: ' + e.message, 'err');
        }
      }
    }, 150);
  }

  // ============================================================
  // Step 3: Fallback — 외부 브라우저에서 열기
  //
  // 핵심: WebView 안에서 hb.afl URL로 직접 이동하면
  //        v14.2.0의 autoVerify가 가로채서 쿠키 미세팅
  //
  // 해결: Chrome/Samsung Browser Intent로 외부 브라우저 강제 실행
  //       → 외부 브라우저에서 hb.afl 리다이렉트 체인 정상 완료
  //       → 쿠키 세팅 + 매출 귀속 정상
  //
  // Fallback 체인:
  //   ① Chrome Intent → ② Samsung Browser Intent → ③ 직접 이동
  // ============================================================
  function openInBrowser(url) {
    // intent:// 미지원 환경에서는 Chrome/Samsung 이스케이프(intent://)도
    // 데드엔드가 되므로, 그냥 웹 URL(https)로 직접 이동한다.
    if (!canIntent) {
      log('intent:// 미지원 환경 → 웹 URL 직접 이동', 'info');
      try { window.location.href = url; } catch(e) { log('직접 이동 실패: ' + e.message, 'err'); }
      return;
    }

    var path = url.replace(/^https?:\/\//, '');

    // ① Chrome
    //   S.browser_fallback_url 제거(FIX-#3): 미설치 시 WebView가
    //   hb.afl로 조기 이동해 autoVerify에 가로채이는 문제를 차단한다.
    //   브라우저 실행 성공 여부는 document.hidden(화면 이탈)으로 판정.
    log('Chrome Intent 시도...', 'info');
    var chromeIntent = 'intent://' + path +
      '#Intent;scheme=https;package=com.android.chrome;end';

    try {
      window.location.href = chromeIntent;
    } catch(e) {
      log('Chrome Intent 실패: ' + e.message, 'err');
    }

    // ② Samsung Browser (1초 후, 아직 화면에 남아 있으면 = Chrome 실패)
    setTimeout(function() {
      if (document.hidden) return;   // 이미 외부 브라우저로 이탈
      log('Samsung Browser Intent 시도...', 'info');
      var samsungIntent = 'intent://' + path +
        '#Intent;scheme=https;package=com.sec.android.app.sbrowser;end';
      try {
        window.location.href = samsungIntent;
      } catch(e) {
        log('Samsung Intent 실패: ' + e.message, 'err');
      }
    }, 1000);

    // ③ 직접 이동 (2초 후, 최후 수단 — 직접 이동을 의도적으로 허용)
    setTimeout(function() {
      if (document.hidden) return;   // 이미 외부 브라우저로 이탈
      log('직접 이동 (최후 수단)...', 'err');
      window.location.href = url;
    }, 2000);
  }

  // 수동 fallback 버튼 노출 (공통) — 스피너 숨김 + 클릭 핸들러 바인딩
  function showManualFallback() {
    document.getElementById('spinner').style.display = 'none';
    fallbackBtn.style.display = 'inline-block';
    fallbackBtn.onclick = function(e) {
      e.preventDefault();
      log('사용자 수동 클릭 → 외부 브라우저 열기', 'info');
      openInBrowser(fallbackUrl);
    };
  }

  function doFallback() {
    if (appLaunched) {
      log('앱 실행 감지됨 → 자동 fallback 보류 (안전망 타이머가 별도 점검)', 'ok');
      return;
    }

    log('Intent 실패 → 외부 브라우저 fallback 시작', 'err');
    document.getElementById('msg').textContent = 'ブラウザで開きます...';
    showManualFallback();

    // 자동 fallback (800ms 후, 그 사이 화면 이탈하지 않았을 때만)
    setTimeout(function() {
      if (!appLaunched && !document.hidden) openInBrowser(fallbackUrl);
    }, 800);
  }

  // ============================================================
  // Main Flow
  // ============================================================
  if (isAndroid) {
    log('=== Android 흐름 시작 ===', 'info');

    // ── 안전망(FIX-#1): blur 오탐 등으로 화면 전환이 안 될 때 대비 ──
    // appLaunched 값과 무관하게, 4초 뒤에도 페이지가 화면에 떠 있으면
    // (document.hidden=false → 실제로는 앱/브라우저 미실행) 수동 버튼 노출.
    // 앱이 진짜 열렸다면 페이지는 backgrounded라 이 버튼은 보이지 않는다.
    setTimeout(function() {
      if (!document.hidden) {
        log('안전망 발동: 페이지가 여전히 화면에 있음 → 수동 버튼 노출', 'err');
        document.getElementById('msg').textContent = 'うまく開けない場合は、下のボタンを押してください。';
        showManualFallback();
      }
    }, 4000);

    // Step 1 → (완료 대기) → Step 2 → (2.5초 대기) → Step 3
    registerClick(function() {
      fireIntent();

      // 2.5초 후 앱 미실행 시 fallback
      setTimeout(function() {
        if (!appLaunched) {
          doFallback();
        } else {
          log('앱 정상 실행됨 → 완료', 'ok');
        }
      }, 2500);
    });

  } else {
    // iOS / PC: 바로 fallback URL로 이동
    log('=== iOS/PC 흐름: fallback 직행 ===', 'info');
    document.getElementById('msg').textContent = 'リダイレクト中...';
    setTimeout(function() {
      window.location.href = fallbackUrl;
    }, 100);
  }

})();
</script>
</body>
</html>
